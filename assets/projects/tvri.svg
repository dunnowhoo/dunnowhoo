<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="TVRI Citizen Journalism">
<title>TVRI Citizen Journalism</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11131a"/><stop offset="1" stop-color="#0a0b10"/></linearGradient>
 <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f80ed"/><stop offset="1" stop-color="#56ccf2"/></linearGradient>
 <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2f80ed" stop-opacity=".55"/><stop offset="1" stop-color="#2f80ed" stop-opacity="0"/></radialGradient>
 <clipPath id="clip"><rect width="440" height="236" rx="18"/></clipPath>
</defs>
<style>
 text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
 .kind{font-size:10.5px;font-weight:700;letter-spacing:1.6px;fill:#9aa3b5}
 .title{font-size:24px;font-weight:800;fill:#fff;letter-spacing:-.3px}
 .body{font-size:12.5px;fill:#c3c9d6}
 .chip{font-size:11px;font-weight:600;fill:#e6e9f0}
 .badge{font-size:10.5px;font-weight:700;fill:#fff}
 .cta{font-size:12px;font-weight:700;fill:url(#ac)}
 .live{font-size:10px;font-weight:800;letter-spacing:1px;fill:#3ddc84}
 .orb{animation:drift 9s ease-in-out infinite alternate}
 @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-60px,30px)}}
 @media (prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
<g clip-path="url(#clip)">
 <rect width="440" height="236" fill="url(#bg)"/>
 <circle class="orb" cx="400" cy="10" r="150" fill="url(#glow)"/>
 <rect width="440" height="3" fill="url(#ac)"/>
</g>
<rect x=".5" y=".5" width="439" height="235" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity=".10"/>
<text x="24" y="31" class="kind">MOBILE · MEDIA</text>
<circle cx="311" cy="210" r="4" fill="#3ddc84"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="24" y="74" class="title">TVRI Citizen Journalism</text>
<text x="24" y="108" class="body">Citizen journalism app for TVRI Nasional with</text><text x="24" y="127" class="body">real-time chat and video reporting. Built the</text><text x="24" y="146" class="body">WebSocket chat and shipped it to both stores.</text>
<g transform="translate(24 176)"><rect width="66" height="24" rx="12" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/><text x="33.0" y="16" text-anchor="middle" class="chip">Flutter</text></g><g transform="translate(96 176)"><rect width="79" height="24" rx="12" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/><text x="39.5" y="16" text-anchor="middle" class="chip">WebSocket</text></g><g transform="translate(181 176)"><rect width="79" height="24" rx="12" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/><text x="39.5" y="16" text-anchor="middle" class="chip">App Store</text></g><g transform="translate(266 176)"><rect width="92" height="24" rx="12" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/><text x="46.0" y="16" text-anchor="middle" class="chip">Google Play</text></g>
<text x="416" y="214" text-anchor="end" class="cta">Google Play →</text>
<g transform="translate(224 14)"><rect width="192" height="22" rx="11" fill="url(#ac)" fill-opacity=".9"/><text x="96.0" y="15" text-anchor="middle" class="badge">Shipped to App Store &amp; Play</text></g>
</svg>